name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    # Not evaluated for tag pushes
    paths-ignore:
      - '.gitignore'
      - '*.md'
      - 'LICENSE'
      - '.github/dependabot.yml'
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE: thomasvitale/dt-github-notifier

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel a run that may be publishing an image
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5

      - name: Install devenv
        # Pinned to the nixpkgs revision locked in devenv.lock
        run: nix profile add "github:NixOS/nixpkgs/$(jq -r '.nodes."nixpkgs-src".locked.rev' devenv.lock)#devenv"

      - name: Build devenv shell
        run: devenv test

      - name: Run static checks
        shell: devenv shell bash -- -e {0}
        run: task check

      - name: Run tests
        shell: devenv shell bash -- -e {0}
        run: task test

      - name: Build OCI image
        shell: devenv shell bash -- -e {0}
        run: task image:build PUSH=false

  # Pushes to main publish :sha-<commit> and :main; version tags publish
  # :<version> and :latest and create a GitHub release.
  package:
    if: ${{ github.event_name == 'push' }}
    name: Package
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    needs: [build]
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write # create the GitHub release
      id-token: write
      packages: write
    steps:
      - name: Check out source code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5

      - name: Install devenv
        # Pinned to the nixpkgs revision locked in devenv.lock
        run: nix profile add "github:NixOS/nixpkgs/$(jq -r '.nodes."nixpkgs-src".locked.rev' devenv.lock)#devenv"

      - name: Build devenv shell
        run: devenv test

      - name: Determine version
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            # The version ends up in shell commands, and git allows characters
            # such as $, ; and ` in tag names.
            if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::Tag ${GITHUB_REF_NAME} is not a semantic version (vX.Y.Z[-prerelease])"
              exit 1
            fi
            VERSION="${GITHUB_REF_NAME#v}"
            TAGS="${VERSION}"
            # Pre-releases (vX.Y.Z-rc.1) do not move latest
            if [[ "${VERSION}" != *-* ]]; then
              TAGS="${TAGS},latest"
            fi
          else
            VERSION="sha-${GITHUB_SHA::7}"
            TAGS="${VERSION},main"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "TAGS=${TAGS}" >> "$GITHUB_ENV"

      - name: Log into container registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "${GITHUB_TOKEN}" | docker login "${REGISTRY}" -u "${GITHUB_ACTOR}" --password-stdin

      - name: Build and publish multi-arch OCI image
        shell: devenv shell bash -- -e {0}
        run: task image:build VERSION="${VERSION}" TAGS="${TAGS}"

      - name: Sign OCI image
        shell: devenv shell bash -- -e {0}
        run: task image:sign VERSION="${VERSION}"

      - name: Read image digest
        shell: devenv shell bash -- -e {0}
        run: |
          set -euo pipefail
          IMAGE_DIGEST=$(task image:digest VERSION="${VERSION}")
          echo "IMAGE_DIGEST=${IMAGE_DIGEST}" >> "$GITHUB_ENV"
          echo "Published \`${REGISTRY}/${IMAGE}@${IMAGE_DIGEST}\` with tags \`${TAGS}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Attest OCI image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          subject-digest: ${{ env.IMAGE_DIGEST }}
          push-to-registry: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Render release manifest
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: devenv shell bash -- -e {0}
        run: task release:manifest VERSION="${VERSION}" OUTPUT=knative.yaml

      - name: Create GitHub release
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" knative.yaml \
            --repo "${GITHUB_REPOSITORY}" --verify-tag --generate-notes \
            --notes "Image: \`${REGISTRY}/${IMAGE}@${IMAGE_DIGEST}\`"
