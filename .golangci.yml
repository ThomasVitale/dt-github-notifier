# https://golangci-lint.run/usage/configuration/
version: "2"

linters:
  # errcheck, govet, ineffassign, staticcheck and unused
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gocritic
    - gosec
    - misspell
    - noctx
    - nolintlint
    - revive
    - unconvert
    - usestdlibvars
  settings:
    misspell:
      locale: US
    revive:
      rules:
        # Unexported identifiers in a main package need no doc comments
        - name: exported
          disabled: true
  exclusions:
    presets:
      - std-error-handling
    rules:
      # Test helpers and fakes may ignore errors and use fixed inputs
      - path: _test\.go
        linters:
          - gosec

formatters:
  enable:
    - gofmt
    - goimports
