# apiVersion: v1
# kind: Secret
# metadata:
#   name: dt-github-notifier-secret
#   namespace: dependency-track
# type: Opaque
# Create with:
#   kubectl create secret generic dt-github-notifier-secret \
#     --from-literal=github-token=ghp_yourTokenHere \
#     --from-literal=dt-api-key=yourDTApiKey \
#     --from-literal=webhook-secret=yourWebhookSigningSecret \
#     --namespace dependency-track
# The DT API key needs the read-only VIEW_PORTFOLIO and PORTFOLIO_MANAGEMENT_READ
# permissions (the latter to read the github/repo project property).
# The webhook secret must match the signing secret of the DT webhook alert.
# Do NOT commit real tokens to git.

---
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: dt-github-notifier
  namespace: dependency-track
  labels:
    # cluster-local makes the Knative Service reachable only inside the cluster.
    # It will NOT be exposed through the external ingress gateway.
    # URL will be: http://dt-github-notifier.dependency-track.svc.cluster.local
    networking.knative.dev/visibility: cluster-local
spec:
  template:
    metadata:
      annotations:
        # Scale down to zero when no requests are in flight.
        autoscaling.knative.dev/min-scale: "0"
        # Never spin up more than 3 replicas — DT sends one webhook at a time.
        autoscaling.knative.dev/max-scale: "3"
        # Use concurrency-based autoscaling; spin up a new pod after 10 in-flight requests.
        autoscaling.knative.dev/target: "10"
    spec:
      # Maximum duration of a request. Kept above the 8 s the bridge allows itself
      # per notification (Dependency-Track waits 10 s for a webhook response), so
      # Knative never cuts off a request the bridge is still handling.
      timeoutSeconds: 30

      containers:
        - name: bridge
          # ko replaces this placeholder with the real digest at deploy time.
          # See the Taskfile tasks: task deploy / task resolve.
          image: ko://github.com/thomasvitale/dt-github-notifier
          ports:
            - name: http1     # HTTP/1.1 — matches Go's net/http default server
              containerPort: 8080
          env:
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dt-github-notifier-secret
                  key: github-token
            # The repo is inferred automatically from each DT project's vcs external
            # reference, project property (group=github name=repo), or PURL.
            # Set GITHUB_REPO as a fallback for projects that have none of those.
            - name: GITHUB_REPO
              value: ""                 # optional fallback, e.g. "myorg/myrepo"
            - name: DT_BASE_URL
              # Internal cluster DNS — same namespace as Dependency-Track.
              value: "http://dependency-track-api-server.dependency-track.svc.cluster.local:8080"
            - name: DT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: dt-github-notifier-secret
                  key: dt-api-key
            # Verifies the X-Webhook-Signature header sent by Dependency-Track 5.2+.
            # Optional (the key may be absent), but strongly recommended.
            - name: DT_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: dt-github-notifier-secret
                  key: webhook-secret
                  optional: true
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 1
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 15
