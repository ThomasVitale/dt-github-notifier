# https://taskfile.dev

version: '3'

env:
  # Your container registry. Override via env.
  # e.g.  KO_DOCKER_REPO=ghcr.io/myorg/dt-github-notifier task deploy
  KO_DOCKER_REPO: '{{.KO_DOCKER_REPO | default "ghcr.io/yourorg/dt-github-notifier"}}'
  # Platforms to build for. Override with e.g. KO_DEFAULTPLATFORMS=all
  KO_DEFAULTPLATFORMS: '{{.KO_DEFAULTPLATFORMS | default "linux/amd64,linux/arm64"}}'

vars:
  NAMESPACE: dependency-track
  SERVICE_NAME: dt-github-notifier

tasks:

  # =============================================
  # Development
  # =============================================

  build:
    desc: Compile locally (no image push) to catch errors fast
    cmds:
      - go build ./...

  fmt:
    desc: Format the code (gofmt + goimports)
    cmds:
      - golangci-lint fmt

  # =============================================
  # Quality
  # =============================================

  check:
    desc: Run all static checks (go.mod tidiness, formatting, linters, vulnerabilities)
    cmds:
      - task: mod:check
      - task: lint
      - task: vuln

  mod:check:
    desc: Check that go.mod and go.sum are tidy
    cmds:
      - go mod tidy -diff

  lint:
    desc: Run golangci-lint (includes go vet and formatting checks)
    cmds:
      - golangci-lint run

  vuln:
    desc: Scan for known vulnerabilities in dependencies and the Go standard library (honoring .govulncheck-ignore)
    silent: true
    cmds:
      # Fails on vulnerabilities in code the module calls, like plain govulncheck,
      # except for the OSV IDs accepted in .govulncheck-ignore.
      - |
        set -eo pipefail
        report=$(govulncheck -format json ./...)
        ignored=$(grep -v -E '^[[:space:]]*(#|$)' .govulncheck-ignore || true)
        called=$(echo "$report" | jq -r 'select(.finding.trace[0].function) | .finding.osv' | sort -u)
        failed=0
        for id in $called; do
          summary=$(echo "$report" | jq -r --arg id "$id" 'select(.osv.id == $id) | .osv.summary')
          if echo "$ignored" | grep -qx "$id"; then
            echo "⚠️  $id (ignored in .govulncheck-ignore): $summary"
          else
            echo "❌ $id: $summary (https://pkg.go.dev/vuln/$id)"
            failed=1
          fi
        done
        for id in $ignored; do
          if ! echo "$called" | grep -qx "$id"; then
            echo "ℹ️  $id is no longer reported: remove it from .govulncheck-ignore"
          fi
        done
        if [ "$failed" -ne 0 ]; then
          echo "Run 'govulncheck ./...' for details."
          exit 1
        fi
        echo "✅ No vulnerabilities in called code (besides ignored ones)"

  # =============================================
  # Testing
  # =============================================

  test:
    desc: Run unit tests
    cmds:
      - go test -race -shuffle=on ./...

  test:coverage:
    desc: Run unit tests and open the coverage report
    cmds:
      - go test -race -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out

  # =============================================
  # Image Operations
  # =============================================

  image:update-base:
    desc: Pin the ko base image in .ko.yaml to the current digest of its tag
    cmds:
      - |
        image=$(sed -n 's/^defaultBaseImage: *//p' .ko.yaml)
        tag=${image%@*}
        digest=$(crane digest "$tag")
        sed -i.bak "s|^defaultBaseImage: .*|defaultBaseImage: $tag@$digest|" .ko.yaml && rm .ko.yaml.bak
        echo "Base image pinned to $tag@$digest"

  push:
    desc: Build multi-arch image and push to registry (no deploy)
    cmds:
      - ko build --platform=$KO_DEFAULTPLATFORMS --bare .

  resolve:
    desc: Render deploy/knative.yaml with the real image digest substituted in (for GitOps)
    cmds:
      - ko resolve --platform=$KO_DEFAULTPLATFORMS --bare -f deploy/knative.yaml

  # =============================================
  # Deployment
  # =============================================

  deploy:
    desc: Build, push, and apply the Knative Service to the cluster
    cmds:
      - ko apply --platform=$KO_DEFAULTPLATFORMS --bare -f deploy/knative.yaml

  undeploy:
    desc: Remove the Knative Service from the cluster
    cmds:
      - kubectl delete -f deploy/knative.yaml --ignore-not-found

  secret:
    desc: "Create the GitHub token + DT API key (+ optional webhook signing secret) secret (usage: GITHUB_TOKEN=ghp_xxx DT_API_KEY=xxx DT_WEBHOOK_SECRET=xxx task secret)"
    requires:
      vars: [GITHUB_TOKEN, DT_API_KEY]
    cmds:
      - |
        set --
        if [ -n "${DT_WEBHOOK_SECRET:-}" ]; then
          set -- --from-literal=webhook-secret="$DT_WEBHOOK_SECRET"
        fi
        kubectl create secret generic {{.SERVICE_NAME}}-secret \
          --from-literal=github-token="$GITHUB_TOKEN" \
          --from-literal=dt-api-key="$DT_API_KEY" \
          "$@" \
          --namespace {{.NAMESPACE}} \
          --dry-run=client -o yaml | kubectl apply -f -

  status:
    desc: Show the Knative Service status
    cmds:
      - kubectl get ksvc {{.SERVICE_NAME}} -n {{.NAMESPACE}}
      - echo ""
      - kubectl get pods -n {{.NAMESPACE}} -l serving.knative.dev/service={{.SERVICE_NAME}}

  logs:
    desc: Tail logs from the bridge (works even with scale-to-zero)
    cmds:
      - kubectl logs -n {{.NAMESPACE}} -l serving.knative.dev/service={{.SERVICE_NAME}} -c bridge --tail=100 -f
