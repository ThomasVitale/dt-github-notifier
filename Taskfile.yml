# https://taskfile.dev

version: '3'

# Image coordinates. Override on the command line, e.g.
#   task deploy REGISTRY=ghcr.io IMAGE=myorg/dt-github-notifier
vars:
  REGISTRY: ghcr.io
  IMAGE: thomasvitale/dt-github-notifier
  # "dev" rather than "latest", which is reserved for releases
  VERSION: '{{.VERSION | default "dev"}}'
  # All the tags to publish; the first should be VERSION
  TAGS: '{{.TAGS | default .VERSION}}'
  PLATFORMS: linux/amd64,linux/arm64
  NAMESPACE: dependency-track
  SERVICE_NAME: dt-github-notifier

env:
  KO_DOCKER_REPO: '{{.REGISTRY}}/{{.IMAGE}}'

tasks:
  default:
    cmds:
      - task --list
    silent: true

  # =============================================
  # Development
  # =============================================

  build:
    desc: Compile locally (no image push) to catch errors fast
    cmds:
      - go build ./...

  fmt:
    desc: Format the code (gofmt + goimports)
    cmds:
      - golangci-lint fmt

  # =============================================
  # Quality
  # =============================================

  check:
    desc: Run all static checks (go.mod tidiness, formatting, linters, vulnerabilities)
    cmds:
      - task: mod:check
      - task: lint
      - task: vuln

  mod:check:
    desc: Check that go.mod and go.sum are tidy
    cmds:
      - go mod tidy -diff

  lint:
    desc: Run golangci-lint (includes go vet and formatting checks)
    cmds:
      - golangci-lint run

  vuln:
    desc: Scan for known vulnerabilities in dependencies and the Go standard library (honoring .govulncheck-ignore)
    silent: true
    cmds:
      # Fails on vulnerabilities in code the module calls, like plain govulncheck,
      # except for the OSV IDs accepted in .govulncheck-ignore.
      - |
        set -eo pipefail
        report=$(govulncheck -format json ./...)
        ignored=$(grep -v -E '^[[:space:]]*(#|$)' .govulncheck-ignore || true)
        called=$(echo "$report" | jq -r 'select(.finding.trace[0].function) | .finding.osv' | sort -u)
        failed=0
        for id in $called; do
          summary=$(echo "$report" | jq -r --arg id "$id" 'select(.osv.id == $id) | .osv.summary')
          if echo "$ignored" | grep -qx "$id"; then
            echo "⚠️  $id (ignored in .govulncheck-ignore): $summary"
          else
            echo "❌ $id: $summary (https://pkg.go.dev/vuln/$id)"
            failed=1
          fi
        done
        for id in $ignored; do
          if ! echo "$called" | grep -qx "$id"; then
            echo "ℹ️  $id is no longer reported: remove it from .govulncheck-ignore"
          fi
        done
        if [ "$failed" -ne 0 ]; then
          echo "Run 'govulncheck ./...' for details."
          exit 1
        fi
        echo "✅ No vulnerabilities in called code (besides ignored ones)"

  # =============================================
  # Testing
  # =============================================

  test:
    desc: Run unit tests
    cmds:
      - go test -race -shuffle=on ./...

  test:coverage:
    desc: Run unit tests and open the coverage report
    cmds:
      - go test -race -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out

  # =============================================
  # Image Operations
  # =============================================

  deps:update:
    desc: Update the devenv inputs (Go and the other tools) and pin the ko base image to its latest digest
    cmds:
      - devenv update
      - task: image:update-base

  image:update-base:
    desc: Pin the ko base image in .ko.yaml to the current digest of its tag
    cmds:
      - |
        image=$(sed -n 's/^defaultBaseImage: *//p' .ko.yaml)
        tag=${image%@*}
        digest=$(crane digest "$tag")
        sed -i.bak "s|^defaultBaseImage: .*|defaultBaseImage: $tag@$digest|" .ko.yaml && rm .ko.yaml.bak
        echo "Base image pinned to $tag@$digest"

  image:build:
    desc: Build and publish the multi-arch OCI image with TAGS (PUSH=false only builds it)
    vars:
      PUSH: '{{.PUSH | default "true"}}'
      REVISION:
        sh: git rev-parse HEAD
    cmds:
      - ko build --bare --platform={{.PLATFORMS}} --tags={{.TAGS}} --push={{.PUSH}}
          --image-label=org.opencontainers.image.source=https://github.com/ThomasVitale/dt-github-notifier
          --image-label=org.opencontainers.image.revision={{.REVISION}}
          .

  image:digest:
    desc: Print the digest of the published OCI image
    silent: true
    cmds:
      - crane digest {{.REGISTRY}}/{{.IMAGE}}:{{.VERSION}}

  image:sign:
    desc: Sign the published OCI image with Cosign
    vars:
      IMAGE_DIGEST:
        sh: crane digest {{.REGISTRY}}/{{.IMAGE}}:{{.VERSION}}
    cmds:
      - echo "Signing image{{":"}} {{.REGISTRY}}/{{.IMAGE}}@{{.IMAGE_DIGEST}}"
      - cosign sign --yes {{.REGISTRY}}/{{.IMAGE}}@{{.IMAGE_DIGEST}}

  release:manifest:
    desc: Render deploy/knative.yaml with the published image pinned by digest (into OUTPUT, default knative.yaml)
    vars:
      OUTPUT: '{{.OUTPUT | default "knative.yaml"}}'
      IMAGE_DIGEST:
        sh: crane digest {{.REGISTRY}}/{{.IMAGE}}:{{.VERSION}}
    cmds:
      - sed "s|image{{":"}} ko://.*|image{{":"}} {{.REGISTRY}}/{{.IMAGE}}@{{.IMAGE_DIGEST}}|" deploy/knative.yaml > {{.OUTPUT}}
      - grep -q "{{.REGISTRY}}/{{.IMAGE}}@{{.IMAGE_DIGEST}}" {{.OUTPUT}}
      - echo "Wrote {{.OUTPUT}} with image {{.REGISTRY}}/{{.IMAGE}}@{{.IMAGE_DIGEST}}"

  resolve:
    desc: Build and publish the image, and render deploy/knative.yaml with its digest
    cmds:
      - ko resolve --bare --platform={{.PLATFORMS}} --tags={{.TAGS}} -f deploy/knative.yaml

  # =============================================
  # Deployment
  # =============================================

  deploy:
    desc: Build and publish the image, and apply the Knative Service to the cluster
    cmds:
      - ko apply --bare --platform={{.PLATFORMS}} --tags={{.TAGS}} -f deploy/knative.yaml

  undeploy:
    desc: Remove the Knative Service from the cluster
    cmds:
      - kubectl delete -f deploy/knative.yaml --ignore-not-found

  secret:
    desc: Create the Secret with the GitHub token, DT API key and webhook signing secret (prompts for values not set in the environment)
    interactive: true
    cmds:
      # The values are read without echo and passed to kubectl through file
      # descriptors, keeping them out of shell history and process arguments.
      - |
        bash -euo pipefail -c '
          for var in GITHUB_TOKEN DT_API_KEY DT_WEBHOOK_SECRET; do
            if [ -z "${!var:-}" ]; then
              read -rsp "$var: " "$var" </dev/tty
              echo
            fi
            if [ -z "${!var}" ]; then
              echo "$var is required" >&2
              exit 1
            fi
          done
          kubectl create secret generic {{.SERVICE_NAME}}-secret \
            --from-file=github-token=<(printf %s "$GITHUB_TOKEN") \
            --from-file=dt-api-key=<(printf %s "$DT_API_KEY") \
            --from-file=webhook-secret=<(printf %s "$DT_WEBHOOK_SECRET") \
            --namespace {{.NAMESPACE}} --dry-run=client -o yaml | kubectl apply -f -
        '

  status:
    desc: Show the Knative Service status
    cmds:
      - kubectl get ksvc {{.SERVICE_NAME}} -n {{.NAMESPACE}}
      - echo ""
      - kubectl get pods -n {{.NAMESPACE}} -l serving.knative.dev/service={{.SERVICE_NAME}}

  logs:
    desc: Tail logs from the bridge (works even with scale-to-zero)
    cmds:
      - kubectl logs -n {{.NAMESPACE}} -l serving.knative.dev/service={{.SERVICE_NAME}} -c bridge --tail=100 -f
